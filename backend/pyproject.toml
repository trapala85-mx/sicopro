[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django==5.2.14",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "django-filter>=25.2",
    "djangorestframework>=3.17.1",
    "psycopg[binary]>=3.3.4",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]